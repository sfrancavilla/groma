<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Groma Fingerprint: the shell's own fingerprint glyph (icons/
       FingerprintIcon.qml, scaled by six) in pearl on a coral glass disc.
       Depth is layered shapes, not filters: Qt's SVG renderer draws none. -->
  <defs>
    <linearGradient id="disc" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffc2b4"/>
      <stop offset="0.5" stop-color="#e8705e"/>
      <stop offset="1" stop-color="#a83c3c"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3dc"/>
    </linearGradient>
  </defs>
  <circle cx="65" cy="68" r="50" fill="#000000" fill-opacity="0.2"/>
  <circle cx="64" cy="64" r="50" fill="url(#disc)"/>
  <path d="M26 46A42 42 0 0 1 102 46" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="none" stroke="#7a2a2e" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" transform="translate(1 2.5)">
    <path d="M35.2 53.2A31.8 31.8 0 0 1 92.8 53.2"/>
    <path d="M41.2 89.4V66.6A22.8 22.8 0 0 1 86.8 66.6V77.4"/>
    <path d="M50.2 78.6V66.6A13.8 13.8 0 0 1 77.8 66.6V99"/>
    <path d="M64 63V100.2"/>
  </g>
  <g fill="none" stroke="url(#ridge)" stroke-width="6" stroke-linecap="round">
    <path d="M35.2 53.2A31.8 31.8 0 0 1 92.8 53.2"/>
    <path d="M41.2 89.4V66.6A22.8 22.8 0 0 1 86.8 66.6V77.4"/>
    <path d="M50.2 78.6V66.6A13.8 13.8 0 0 1 77.8 66.6V99"/>
    <path d="M64 63V100.2"/>
  </g>
</svg>
