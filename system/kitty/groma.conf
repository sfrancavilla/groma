# Groma's settings for kitty, the terminal the keybinding and the shell open.
# install.sh links this file into ~/.config/kitty and includes it from
# kitty.conf; your own settings go in kitty.conf, after the include, where
# they win.

# Copy and paste on the keys every other application uses. With text
# selected, Ctrl+C copies it and clears the selection; with nothing selected
# it interrupts the running program, as it always has - so a second press
# after a copy is an interrupt. Ctrl+Shift+C and Ctrl+Shift+V still work.
#
# Ctrl+V no longer reaches the program inside: in Vim, block selection is
# Ctrl+Q instead.
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

# Closing a window closes it. kitty otherwise asks first whenever something
# is running, and the windows the shell opens - btop, a Groma Store job -
# always have something running.
confirm_os_window_close 0

# No sound on the bell: Tab with nothing to complete should not beep.
enable_audio_bell no
