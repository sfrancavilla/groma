# obexd, the Bluetooth file-transfer daemon, trimmed to what Groma uses:
# sending files to a phone, and taking files a phone pushes. Linked by
# install.sh to ~/.config/systemd/user/obex.service.d/groma.conf.
#
# Out of the box obexd also serves File Transfer (a folder anyone trusted can
# browse and write), PC Suite, IrMC sync, phonebook and message access. It
# keeps Object Push alone. That refuses every incoming file unless an agent
# says yes, and Groma's agent (shell/modules/bluetooth-receive.py) asks you
# first, and only about paired devices. The one thing Object Push hands out
# unasked is vcard.vcf from its root, so the root is an empty folder of
# Groma's own; accepted files go to ~/Downloads, by the agent's answer.
#
# Sending is obexd's client side and does not depend on any of these.

[Service]
ExecStartPre=/usr/bin/mkdir -p %h/.local/share/groma/obex
ExecStart=
ExecStart=/usr/lib/bluetooth/obexd -p bluetooth,filesystem,opp -r .local/share/groma/obex
